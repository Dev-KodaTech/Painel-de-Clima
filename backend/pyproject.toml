[project]
name = "weather-dashboard-backend"
version = "0.1.0"
description = "Backend do painel de clima: busca, combina e traduz os dados da Open-Meteo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: bate na API real da Open-Meteo; excluido da execucao padrao",
]
addopts = "-m 'not contract'"
