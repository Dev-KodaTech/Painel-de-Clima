[project]
name = "weather-dashboard-backend"
version = "0.1.0"
description = "Backend do painel de clima: busca, combina e traduz os dados da Open-Meteo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: bate na API real da Open-Meteo; excluido da execucao padrao",
    "postgres: exige o Postgres do compose.yaml subido; excluido da execucao padrao",
]
#: As duas exclusoes pela mesma razao: a suite padrao nao depende de rede nem
#: de infraestrutura, e roda em cerca de um segundo. `postgres` entra aqui,
#: junto de `contract`, porque a alternativa — pular por deteccao, quando a
#: conexao falha — transformaria "o banco nao subiu" em suite verde.
addopts = "-m 'not contract and not postgres'"
